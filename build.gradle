plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.71'
}

version = mod_version
group = 'com.opennight'
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        night {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // ASM for bytecode manipulation (runtime + build)
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'

    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // GSON for config serialization
    implementation 'com.google.code.gson:gson:2.10.1'
}

// JAR manifest for Java agent
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Premain-Class'           : 'com.opennight.asm.Bootstrap',
            'Agent-Class'             : 'com.opennight.asm.Bootstrap',
            'Can-Retransform-Classes' : 'true',
            'Can-Redefine-Classes'    : 'true'
        ])
    }
}
